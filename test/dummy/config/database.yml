default: &default
  adapter: postgresql
  encoding: utf8
  pool: 5
  timeout: 5000
  timeout: 5000
  username: postgres
  password: postgres
  host: <%= ENV.fetch("DB_HOST") { "postgres" } %>

development:
  <<: *default
  database: liquidum_development

test:
  <<: *default
  database: liquidum_test

production:
  <<: *default
  database: liquidum_production
